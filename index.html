<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>サイト更新中 | The Translator's Grimoire</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Noto+Serif+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --sepia: #8B6F4E; --sepia-dark: #5C4033; --sepia-mid: #C4A882;
      --sepia-light: #F0E6D3; --sepia-pale: #FAF5ED;
      --blue-dark: #4A7A8A; --blue-mid: #A8C8D4; --blue-light: #DFF0F4; --blue-pale: #EEF7FA;
      --text: #2C1F14; --text-sub: #6B5240;
      --font: 'Noto Serif JP', serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background-color: var(--sepia-pale);
      background-image: repeating-conic-gradient(var(--sepia-light) 0% 25%, var(--blue-pale) 0% 50%);
      background-size: 48px 48px;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .box {
      max-width: 520px;
      width: 100%;
      text-align: center;
      background: rgba(255,255,255,0.9);
      border: 1px solid var(--sepia-mid);
      border-radius: 18px;
      padding: 2.8rem 2rem 2.4rem;
      box-shadow: 0 4px 24px rgba(92,64,51,.12);
      animation: fadeUp .7s ease both;
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1rem;
      color: var(--sepia-dark);
      margin-bottom: 1.6rem;
    }

    .icon {
      font-size: 2.6rem;
      margin-bottom: .6rem;
      display: inline-block;
      animation: flip 3s ease-in-out infinite;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 6vw, 2.3rem);
      font-weight: 900;
      font-style: italic;
      color: var(--sepia-dark);
      text-shadow: 2px 3px 0 rgba(196,168,130,0.35);
      margin-bottom: .3rem;
    }
    h1 span { color: var(--blue-dark); }

    .ja {
      font-size: 1rem;
      font-weight: 300;
      letter-spacing: .25em;
      color: var(--text-sub);
      margin-bottom: 1.4rem;
    }

    .divider {
      display: flex; align-items: center; justify-content: center;
      gap: 12px; margin-bottom: 1.4rem;
    }
    .divider i { width: 50px; height: 1px; background: var(--sepia-mid); display: block; }
    .divider b { color: var(--sepia-mid); font-weight: 400; letter-spacing: .2em; font-size: 14px; }

    p.msg { font-size: 14px; line-height: 2; color: var(--text-sub); }

    .dots::after {
      content: '';
      animation: dots 1.6s steps(4, end) infinite;
    }

    .note {
      margin-top: 1.6rem;
      font-size: 12px;
      color: var(--blue-dark);
      background: var(--blue-pale);
      border-left: 3px solid var(--blue-mid);
      border-radius: 0 8px 8px 0;
      padding: .6rem .9rem;
      text-align: left;
      line-height: 1.8;
    }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes flip { 0%, 100% { transform: rotateY(0); } 50% { transform: rotateY(180deg); } }
    @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
  </style>
</head>
<body>

  <div class="box">
    <div class="logo">📜 The Translator's Grimoire</div>
    <div class="icon">📖</div>
    <h1>Under <span>Construction</span></h1>
    <div class="ja">— サイト更新中 —</div>
    <div class="divider"><i></i><b>✦ ✦ ✦</b><i></i></div>
    <p class="msg">
      ただいまサイトを更新しています<span class="dots"></span><br>
      ページをめくる準備ができたら、また公開しますので<br>
      しばらくお待ちください。
    </p>
    <p class="note">
      お急ぎのご連絡は Bluesky などからお願いします。
    </p>
  </div>

</body>
</html>
